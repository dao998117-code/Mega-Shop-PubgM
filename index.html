<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Shop PubgM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0b1220, #1a283d);
            color: #fff;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .top-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 800;
        }
        .heart {
            color: #ff3b30;
        }
        .top-hotline {
            background: linear-gradient(90deg, #facc15, #f59e0b);
            color: #000;
            padding: 8px 14px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            border: 1px solid rgba(250, 204, 21, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            margin-bottom: 24px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 16px;
            border: 4px solid #facc15;
            overflow: hidden;
            background: #000;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .shop-name {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
        }
        .desc {
            color: #cbd5e1;
            line-height: 1.8;
            margin: 16px 0 24px;
            font-size: 16px;
        }
        .hotline-text {
            font-size: 18px;
            font-weight: 600;
            color: #facc15;
            margin-bottom: 28px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .zalo {
            background: linear-gradient(90deg, #0091ff, #00c6ff);
            color: white;
        }
        .fb {
            background: linear-gradient(90deg, #1877f2, #3b82f6);
            color: white;
        }
        .call {
            background: linear-gradient(90deg, #facc15, #f59e0b);
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="top-left">
                <span class="heart">♥</span>
                <span>Mega Shop PubgM</span>
            </div>
            <div class="top-hotline">0819.904.567</div>
        </div>

        <div class="card">
            <div class="avatar">
                <img src="https://cdn.discordapp.com/attachments/1549636738140479538/1555120303619965010/FB_IMG_1790668533761.jpg?backend=b2&ex=6abf5e25&is=6abe0ca5&hm=8e2288c13bac86546095ab00fa66d09a1f68704a130cd42a3451cd2201e26ea2&" alt="Avatar">
            </div>

            <h1 class="shop-name">Mega Shop PubgM ✅</h1>
            
            <p class="desc">
                🎮 Chuyên: Bán & Ký tài khoản PUBG Mobile<br>
                ✅ Uy tín hàng đầu • Bảo hành nhanh<br>
                💬 Tư vấn tận tâm 24/7
            </p>

            <div class="hotline-text">📞 Hotline/Zalo: 0819.904.567</div>

            <a href="https://zalo.me/0819904567" class="btn zalo">
                💬 NHẮN ZALO
            </a>

            <a href="https://facebook.com/" class="btn fb">
                📘 FACEBOOK
            </a>

            <a href="tel:0819904567" class="btn call">
                📞 GỌI NGAY
            </a>
        </div>
    </div>
</body>
</html>
